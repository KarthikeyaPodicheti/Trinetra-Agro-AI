name: Production Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  production-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        env:
          DATABASE_URL: sqlite:///data/trinetra.db
        run: |
          python -m pytest

      - name: Compile sources
        run: |
          python -m compileall app quick_start.py healthcheck.py otp_gateway.py production_runner.py

      - name: Run quick smoke demo
        env:
          DATABASE_URL: sqlite:///data/trinetra.db
        run: |
          python quick_start.py

      - name: Run production check-only
        env:
          DATABASE_URL: sqlite:///data/trinetra.db
        run: |
          python production_runner.py --check-only

      - name: Run release readiness gate
        env:
          DATABASE_URL: sqlite:///data/trinetra.db
        run: |
          python release_readiness.py --skip-runner --skip-otp-webhook
