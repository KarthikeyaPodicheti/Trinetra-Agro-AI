name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run tests
        run: |
          python -m pytest backend/tests/ -v --tb=short
      - name: Compile check
        run: |
          python -m compileall backend/main.py backend/auth/ backend/routers/ backend/services/ backend/core/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install lint tools
        run: pip install ruff
      - name: Lint check
        continue-on-error: true
        run: ruff check backend/ --ignore=E501,F401,E402
